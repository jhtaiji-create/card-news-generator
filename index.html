<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드뉴스 커버 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F5C518;
    --blue:#1E3FE0;
    --ink:#0B0B14;
    --panel:#15151F;
    --panel2:#1D1D2A;
    --line:#2C2C3A;
    --text:#EDEDF3;
    --muted:#9A9AAE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(30,63,224,0.25), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(245,197,24,0.12), transparent 60%),
      var(--ink);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  header{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:6px;
  }
  header .dot{
    width:12px;height:12px;border-radius:3px;
    background:var(--yellow);
    box-shadow: 4px 4px 0 var(--blue);
    flex:none;
  }
  h1{
    font-size:22px;
    margin:0;
    letter-spacing:-0.02em;
  }
  .sub{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 28px 24px;
  }
  .layout{
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width: 880px){
    .layout{grid-template-columns: 1fr;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:8px;
    letter-spacing:-0.01em;
  }
  textarea, input[type=text]{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:9px;
    padding:11px 12px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px;
    resize:vertical;
    line-height:1.5;
  }
  textarea:focus, input:focus{
    outline:none;
    border-color:var(--blue);
  }
  .hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:6px;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .upload-box{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    background:var(--panel2);
    transition:border-color .15s;
  }
  .upload-box:hover{border-color:var(--blue);}
  .upload-box input{display:none;}
  .upload-box .icon{font-size:22px;display:block;margin-bottom:6px;}
  .upload-box .label{font-size:13px;color:var(--text);font-weight:500;}
  .upload-box .file-name{
    font-size:11.5px;color:var(--yellow);margin-top:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .slider-row{
    display:flex;align-items:center;gap:10px;
  }
  .slider-row input[type=range]{
    flex:1;accent-color:var(--blue);
  }
  .slider-row .val{
    font-size:12px;color:var(--muted);width:38px;text-align:right;
  }
  .btn{
    width:100%;
    padding:13px 16px;
    border:none;
    border-radius:9px;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    letter-spacing:-0.01em;
  }
  .btn-primary{
    background:var(--blue);
    color:#fff;
    margin-top:6px;
  }
  .btn-primary:hover{background:#1834b8;}
  .preview-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .canvas-shell{
    background:#000;
    border-radius:14px;
    padding:8px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  canvas{
    display:block;
    width:100%;
    max-width:400px;
    height:auto;
    border-radius:8px;
  }
  .align-toggle{
    display:flex;
    gap:8px;
  }
  .align-toggle button{
    flex:1;
    padding:8px 10px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:8px;
    cursor:pointer;
    font-size:12.5px;
    font-family:'Noto Sans KR', sans-serif;
  }
  .align-toggle button.active{
    border-color:var(--yellow);
    color:var(--yellow);
    background:rgba(245,197,24,0.08);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot"></div>
    <h1>카드뉴스 커버 생성기</h1>
  </header>
  <p class="sub">사진 + 제목 + 계정명을 입력하면 레퍼런스와 같은 스타일로 표지를 만들어줘요</p>

  <div class="layout">
    <div class="panel">

      <div class="field">
        <label>배경 이미지</label>
        <div class="upload-box" id="uploadBox">
          <input type="file" id="imgInput" accept="image/*">
          <span class="icon">🖼️</span>
          <span class="label">클릭해서 이미지 업로드</span>
          <div class="file-name" id="fileName"></div>
        </div>
      </div>

      <div class="field">
        <label>제목 (줄바꿈으로 여러 줄 입력)</label>
        <textarea id="titleInput" rows="3" placeholder="나만 알고싶은&#10;9,10월 공모전&#10;TOP5">나만 알고싶은
9,10월 공모전
TOP5</textarea>
      </div>

      <div class="field">
        <label>계정명</label>
        <input type="text" id="handleInput" placeholder="@ggomul_company" value="@ggomul_company">
      </div>

      <div class="field">
        <label>정렬</label>
        <div class="align-toggle">
          <button type="button" data-align="left" class="active">왼쪽</button>
          <button type="button" data-align="center">가운데</button>
        </div>
      </div>

      <div class="field">
        <label>제목 글자 크기</label>
        <div class="slider-row">
          <input type="range" id="fontSize" min="40" max="100" value="68">
          <span class="val" id="fontSizeVal">68</span>
        </div>
      </div>

      <div class="field">
        <label>하단 그림자(가독성) 강도</label>
        <div class="slider-row">
          <input type="range" id="shadowStrength" min="0" max="100" value="80">
          <span class="val" id="shadowVal">80</span>
        </div>
      </div>

      <div class="field">
        <label>이미지 위치 (드래그로도 이동 가능)</label>
        <div class="row2">
          <div class="slider-row">
            <span class="val" style="width:auto;color:var(--muted);">확대</span>
            <input type="range" id="zoom" min="100" max="200" value="100">
          </div>
        </div>
        <div class="hint">미리보기 이미지를 드래그하면 위치를 옮길 수 있어요</div>
      </div>

      <button class="btn btn-primary" id="downloadBtn">PNG로 저장</button>
    </div>

    <div class="preview-col">
      <div class="canvas-shell">
        <canvas id="canvas" width="1080" height="1350"></canvas>
      </div>
      <div class="hint">완성 크기: 1080 × 1350px (인스타 카드뉴스 4:5 비율)</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let bgImage = null;
let imgOffset = {x:0, y:0};
let imgZoom = 1;
let dragging = false, dragStart = {x:0,y:0}, offsetStart = {x:0,y:0};
let align = 'left';

const titleInput = document.getElementById('titleInput');
const handleInput = document.getElementById('handleInput');
const fontSizeSlider = document.getElementById('fontSize');
const fontSizeVal = document.getElementById('fontSizeVal');
const shadowSlider = document.getElementById('shadowStrength');
const shadowVal = document.getElementById('shadowVal');
const zoomSlider = document.getElementById('zoom');
const imgInput = document.getElementById('imgInput');
const fileName = document.getElementById('fileName');
const uploadBox = document.getElementById('uploadBox');

document.querySelectorAll('.align-toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.align-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    align = btn.dataset.align;
    draw();
  });
});

uploadBox.addEventListener('click', ()=> imgInput.click());
imgInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  fileName.textContent = file.name;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      bgImage = img;
      imgOffset = {x:0,y:0};
      imgZoom = 1;
      zoomSlider.value = 100;
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

[titleInput, handleInput].forEach(el=> el.addEventListener('input', draw));
fontSizeSlider.addEventListener('input', ()=>{
  fontSizeVal.textContent = fontSizeSlider.value;
  draw();
});
shadowSlider.addEventListener('input', ()=>{
  shadowVal.textContent = shadowSlider.value;
  draw();
});
zoomSlider.addEventListener('input', ()=>{
  imgZoom = zoomSlider.value/100;
  draw();
});

// drag to reposition image
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = W/rect.width;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleX};
}
canvas.addEventListener('mousedown', (e)=>{
  if(!bgImage) return;
  dragging = true;
  dragStart = getPos(e);
  offsetStart = {...imgOffset};
});
window.addEventListener('mousemove', (e)=>{
  if(!dragging) return;
  const p = getPos(e);
  imgOffset.x = offsetStart.x + (p.x - dragStart.x);
  imgOffset.y = offsetStart.y + (p.y - dragStart.y);
  draw();
});
window.addEventListener('mouseup', ()=> dragging=false);

function drawBackground(){
  if(!bgImage){
    // placeholder
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#F5C518');
    grad.addColorStop(1,'#1E3FE0');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '500 26px "Noto Sans KR"';
    ctx.textAlign = 'center';
    ctx.fillText('이미지를 업로드해주세요', W/2, H/2);
    ctx.textAlign = 'left';
    return;
  }
  const iw = bgImage.width, ih = bgImage.height;
  const canvasRatio = W/H;
  const imgRatio = iw/ih;
  let drawW, drawH;
  if(imgRatio > canvasRatio){
    drawH = H * imgZoom;
    drawW = drawH * imgRatio;
  } else {
    drawW = W * imgZoom;
    drawH = drawW / imgRatio;
  }
  const baseX = (W-drawW)/2;
  const baseY = (H-drawH)/2;
  ctx.drawImage(bgImage, baseX+imgOffset.x, baseY+imgOffset.y, drawW, drawH);
}

function wrapAndDrawTitle(lines, fontSize){
  const lineHeight = fontSize * 1.16;
  const paddingX = 56;
  const bottomY = H - 84 - 46; // leave room for handle
  const totalH = lineHeight * lines.length;
  let startY = bottomY - totalH + lineHeight*0.82;

  ctx.font = `900 ${fontSize}px "Noto Sans KR", sans-serif`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = align === 'center' ? 'center' : 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.65)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 3;

  const x = align === 'center' ? W/2 : paddingX;

  lines.forEach((line, i)=>{
    ctx.fillText(line, x, startY + i*lineHeight);
  });

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  return {x, bottomTextY: startY + (lines.length-1)*lineHeight};
}

function drawHandle(text, refX){
  const paddingX = 56;
  const y = H - 60;
  ctx.font = `500 30px "Noto Sans KR", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.textAlign = align === 'center' ? 'center' : 'left';
  const x = align === 'center' ? W/2 : paddingX;
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 8;
  ctx.fillText(text, x, y);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();

  // bottom gradient for legibility
  const strength = shadowSlider.value/100;
  if(strength > 0){
    const grad = ctx.createLinearGradient(0, H*0.32, 0, H);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.45, `rgba(0,0,0,${0.22*strength})`);
    grad.addColorStop(0.75, `rgba(0,0,0,${0.55*strength})`);
    grad.addColorStop(1, `rgba(0,0,0,${0.92*strength})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  const rawLines = titleInput.value.split('\n').filter(l=>l.length>0);
  const lines = rawLines.length ? rawLines : ['제목을 입력하세요'];
  const fontSize = parseInt(fontSizeSlider.value,10);
  const {x} = wrapAndDrawTitle(lines, fontSize);

  const handle = handleInput.value.trim();
  if(handle) drawHandle(handle, x);
}

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'card-cover.png';
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
});

// wait for fonts then draw
document.fonts.ready.then(draw);
draw();
setTimeout(draw, 300); // fallback in case font loads slightly late
</script>
</body>
</html>
